services:
  - type: web
    name: cultural-heritage-recommender
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cultural-heritage-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: cultural-heritage-db
    databaseName: cultural_heritage
    user: cultural_heritage
